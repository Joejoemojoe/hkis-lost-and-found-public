name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Build and export a static site. NOTE: Next.js API routes will NOT work on GitHub Pages.
        run: |
          npm run build
          npm run export

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

# Important: This workflow exports a static site using `next export` and publishes the
# generated `out/` directory to the `gh-pages` branch. Next.js API routes (under
# `pages/api`) are server-side and will not be available when hosting on GitHub Pages.
